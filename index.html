        /* Animated Blobs */
        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 12s infinite ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        /* Hero motion system: intentionally quiet, so the work remains the focus. */
        .hero-experimental {
            isolation: isolate;
        }

        .hero-orbit {
            border: 1px solid rgba(75, 156, 211, 0.32);
            box-shadow: 0 0 42px rgba(75, 156, 211, 0.12), inset 0 0 32px rgba(75, 156, 211, 0.04);
            transform-origin: center;
            animation: orbit-drift 18s ease-in-out infinite alternate;
        }

        .hero-orbit--wide {
            animation-duration: 24s;
            animation-direction: alternate-reverse;
        }

        .hero-particle {
            background: #7BAFD4;
            box-shadow: 0 0 16px rgba(123, 175, 212, 0.95);
            animation: particle-drift 7s ease-in-out infinite alternate;
        }

        .hero-particle--slow {
            animation-duration: 11s;
            animation-delay: -4s;
        }

        .hero-particle--fast {
            animation-duration: 5s;
            animation-delay: -2s;
        }

        .hero-portrait-frame {
            box-shadow: 0 24px 80px rgba(2, 12, 27, 0.32), 0 0 0 1px rgba(123, 175, 212, 0.12);
        }

        .dark .hero-portrait-frame {
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42), 0 0 36px rgba(75, 156, 211, 0.28), 0 0 0 1px rgba(123, 175, 212, 0.4);
        }

        .hero-signal {
            animation: signal-breathe 3.6s ease-in-out infinite;
        }

        @keyframes orbit-drift {
            from { transform: rotate(-8deg) scale(0.98); opacity: 0.28; }
            to { transform: rotate(9deg) scale(1.04); opacity: 0.62; }
        }

        @keyframes particle-drift {
            from { transform: translate3d(-8px, 10px, 0) scale(0.82); opacity: 0.3; }
            to { transform: translate3d(14px, -16px, 0) scale(1.18); opacity: 0.92; }
        }

        @keyframes signal-breathe {
            0%, 100% { box-shadow: 0 0 0 0 rgba(75, 156, 211, 0.24); }
            50% { box-shadow: 0 0 0 8px rgba(75, 156, 211, 0); }
        }

        /* Shared visual language for interior pages. */
        .page-atlas {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }

        .page-atlas::before {
            content: '';
            position: absolute;
            width: 34rem;
            height: 34rem;
            right: -16rem;
            top: 10rem;
            z-index: -1;
            border: 1px solid rgba(75, 156, 211, 0.18);
            border-radius: 50%;
            box-shadow: 0 0 0 5rem rgba(75, 156, 211, 0.025), 0 0 0 12rem rgba(75, 156, 211, 0.018);
        }

        .page-atlas::after {
            content: '';
            position: absolute;
            width: 20rem;
            height: 20rem;
            left: -12rem;
            bottom: 8rem;
            z-index: -1;
            border: 1px solid rgba(75, 156, 211, 0.12);
            border-radius: 50%;
        }
